name: Sync Notion and publish timeline
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
concurrency:
  group: timeline-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public fields from Notion
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync.mjs
      - name: Save changed public snapshot
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/timeline.json
          git commit -m 'Update public timeline from Notion'
          git push
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
